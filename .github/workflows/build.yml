name: Build MMOItems

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # MMOInventory-API (optional) depends on a parent POM that is not publicly
      # available. Install a minimal placeholder so Maven can resolve it.
      - name: Install missing parent POM for MMOInventory
        run: |
          cat > /tmp/mmoinventory-pom.xml << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>net.Indyuce</groupId>
            <artifactId>MMOInventory</artifactId>
            <version>2.0-SNAPSHOT</version>
            <packaging>pom</packaging>
          </project>
          EOF
          mvn install:install-file \
            -Dfile=/tmp/mmoinventory-pom.xml \
            -DpomFile=/tmp/mmoinventory-pom.xml \
            --batch-mode --no-transfer-progress

      - name: Build with Maven
        run: mvn clean install -DskipTests --batch-mode --no-transfer-progress

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: MMOItems
          path: target/MMOItems-*.jar
          if-no-files-found: error
