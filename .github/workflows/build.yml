name: Build MMOItems

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # Several optional dependencies from the PhoenixDev Nexus reference parent
      # POMs not available in public repos. Install minimal placeholders so
      # Maven can resolve the dependency chain.
      - name: Install missing parent POMs for Phoenix Nexus dependencies
        run: |
          for artifact in "MMOInventory:2.0-SNAPSHOT" "MMOCore:1.12.1-SNAPSHOT"; do
            aid="${artifact%%:*}"
            ver="${artifact##*:}"
            cat > /tmp/parent-pom.xml << EOF
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>net.Indyuce</groupId>
            <artifactId>${aid}</artifactId>
            <version>${ver}</version>
            <packaging>pom</packaging>
          </project>
          EOF
            mvn install:install-file \
              -Dfile=/tmp/parent-pom.xml \
              -DpomFile=/tmp/parent-pom.xml \
              --batch-mode --no-transfer-progress
          done

      - name: Build with Maven
        run: mvn clean install -DskipTests --batch-mode --no-transfer-progress

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: MMOItems
          path: target/MMOItems-*.jar
          if-no-files-found: error
